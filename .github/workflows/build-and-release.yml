name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional v-prefixed SemVer tag to publish (leave empty for artifacts only)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.flavor }}
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: cpu
            requirements: requirements.txt
            archive_suffix: cpu
          - flavor: cuda12
            requirements: requirements-gpu.txt
            archive_suffix: cuda12

    env:
      ALETHEIA_BUILD_FLAVOR: ${{ matrix.flavor }}
      MODELS_RELEASE_TAG: ${{ vars.MODELS_RELEASE_TAG || 'models-v1' }}
      RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
      SOURCE_REF_NAME: ${{ github.ref_name }}
      CURRENT_SHA: ${{ github.sha }}
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate requested release tag
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: pwsh
        run: |
          $requestedTag = $env:RELEASE_TAG_INPUT
          if (-not $requestedTag) {
            $requestedTag = $env:SOURCE_REF_NAME
          }
          if ($requestedTag -notmatch '^v\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Release tag must be a v-prefixed SemVer value, for example v1.2.3"
          }
          $existingCommit = git rev-parse --verify "refs/tags/$requestedTag^{commit}" 2>$null
          if ($LASTEXITCODE -eq 0 -and $existingCommit.Trim() -ne $env:CURRENT_SHA) {
            throw "Tag '$requestedTag' already points to $existingCommit instead of $env:CURRENT_SHA"
          }

      - name: Setup Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10.11"
          cache: pip
          cache-dependency-path: |
            requirements-common.txt
            requirements.txt
            requirements-gpu.txt

      - name: Verify model release exists
        shell: pwsh
        run: |
          gh release view $env:MODELS_RELEASE_TAG --json tagName | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Model release '$env:MODELS_RELEASE_TAG' does not exist. Run tools/publish_model_release.ps1 before publishing an application tag."
          }
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download ONNX models
        shell: pwsh
        run: |
          gh release download $env:MODELS_RELEASE_TAG `
            --pattern "weights.onnx" `
            --dir models/mrcnn `
            --clobber
          gh release download $env:MODELS_RELEASE_TAG `
            --pattern "4x-Fatal-Pixels.onnx" `
            --pattern "4x-Fatal-Pixels.onnx.data" `
            --dir models/esrgan `
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify model assets
        shell: pwsh
        run: |
          $models = @(
            "models/deepcreampy/bar.onnx",
            "models/deepcreampy/mosaic.onnx",
            "models/mrcnn/weights.onnx",
            "models/esrgan/4x-Fatal-Pixels.onnx",
            "models/esrgan/4x-Fatal-Pixels.onnx.data"
          )
          $missing = $models | Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missing) {
            throw "Missing model assets: $($missing -join ', ')"
          }
          foreach ($line in Get-Content -LiteralPath ".github/model-assets.sha256") {
            if ([string]::IsNullOrWhiteSpace($line)) {
              continue
            }
            if ($line -notmatch '^([0-9A-Fa-f]{64})\s+\*(.+)$') {
              throw "Invalid model manifest line: $line"
            }
            $expectedHash = $matches[1].ToUpperInvariant()
            $modelPath = $matches[2].Trim()
            $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $modelPath).Hash
            if ($actualHash -ne $expectedHash) {
              throw "Model hash mismatch for ${modelPath}: expected $expectedHash, got $actualHash"
            }
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "${{ matrix.requirements }}"
          python -m pip install pyinstaller==6.16.0

      - name: Run regression tests
        run: python -B -m unittest discover -s tests -v

      - name: Smoke-test ONNX model loading
        shell: pwsh
        run: |
          python -B -c "import onnxruntime as ort; models=['models/deepcreampy/bar.onnx','models/deepcreampy/mosaic.onnx','models/mrcnn/weights.onnx','models/esrgan/4x-Fatal-Pixels.onnx']; [print(path, ort.InferenceSession(path, providers=['CPUExecutionProvider']).get_providers()) for path in models]"

      - name: Build with PyInstaller
        run: pyinstaller main.spec --noconfirm --clean

      - name: Verify CUDA bundle DLLs
        if: matrix.flavor == 'cuda12'
        shell: pwsh
        run: |
          $bundleRoot = "dist/Aletheia-Lens/_internal"
          $requiredRootDlls = @(
            "cublas64_12.dll",
            "cublasLt64_12.dll",
            "cudart64_12.dll",
            "cudnn64_9.dll",
            "cudnn_adv64_9.dll",
            "cudnn_cnn64_9.dll",
            "cudnn_engines_precompiled64_9.dll",
            "cudnn_engines_runtime_compiled64_9.dll",
            "cudnn_engines_tensor_ir64_9.dll",
            "cudnn_ext64_9.dll",
            "cudnn_graph64_9.dll",
            "cudnn_heuristic64_9.dll",
            "cudnn_ops64_9.dll",
            "cufft64_11.dll",
            "curand64_10.dll"
          )
          $missing = $requiredRootDlls | Where-Object {
            -not (Test-Path -LiteralPath (Join-Path $bundleRoot $_))
          }
          $cudaProvider = Get-ChildItem -LiteralPath $bundleRoot -Recurse -File -Filter "onnxruntime_providers_cuda.dll" | Select-Object -First 1
          if (-not $cudaProvider) {
            $missing += "onnxruntime_providers_cuda.dll"
          }
          if ($missing) {
            throw "CUDA bundle is missing required DLLs: $($missing -join ', ')"
          }
          if (Test-Path -LiteralPath (Join-Path $bundleRoot "nvidia")) {
            throw "CUDA bundle contains duplicate nested NVIDIA DLLs"
          }

      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          $executable = (Resolve-Path "dist/Aletheia-Lens/Aletheia-Lens.exe").Path
          $env:ALETHEIA_SMOKE_REPORT = Join-Path $env:RUNNER_TEMP "Aletheia-Lens-${{ matrix.flavor }}-smoke.txt"
          $smokeArguments = @("--runtime-smoke-test")
          if ("${{ matrix.flavor }}" -eq "cuda12") {
            $smokeArguments += "--require-cuda-provider"
            if (Get-Command nvidia-smi -ErrorAction SilentlyContinue) {
              $smokeArguments += "--require-cuda"
            }
          }
          $process = Start-Process `
            -FilePath $executable `
            -ArgumentList $smokeArguments `
            -WorkingDirectory $env:RUNNER_TEMP `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $env:ALETHEIA_SMOKE_REPORT) {
              Get-Content -LiteralPath $env:ALETHEIA_SMOKE_REPORT | Write-Host
            }
            throw "Packaged runtime smoke test failed with exit code $($process.ExitCode)"
          }
          Get-Content -LiteralPath $env:ALETHEIA_SMOKE_REPORT | Write-Host

      - name: Collect release files
        shell: pwsh
        run: |
          Copy-Item README.md dist/Aletheia-Lens/
          Copy-Item LICENSE dist/Aletheia-Lens/

      - name: Create 7z archive
        shell: pwsh
        run: |
          $requestedTag = $env:RELEASE_TAG_INPUT
          $version = if ($requestedTag) {
            $requestedTag -replace '^v', ''
          } elseif ($env:SOURCE_REF_NAME -like "v*") {
            $env:SOURCE_REF_NAME -replace '^v', ''
          } else {
            "manual-${{ github.run_number }}"
          }
          $archiveName = "Aletheia-Lens_v${version}_${{ matrix.archive_suffix }}.7z"
          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) {
            $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          }
          if (-not (Test-Path -LiteralPath $sevenZip)) {
            throw "7-Zip was not found on the runner"
          }
          & $sevenZip a -t7z -mx=9 "dist/$archiveName" "dist/Aletheia-Lens/*"
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip failed with exit code $LASTEXITCODE"
          }
          $archive = Get-Item -LiteralPath "dist/$archiveName"
          if ($archive.Length -ge 2GB) {
            throw "Archive exceeds GitHub's 2GB release asset limit: $($archive.Length) bytes"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Aletheia-Lens-${{ matrix.archive_suffix }}
          path: dist/Aletheia-Lens_v*.7z
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: Aletheia-Lens-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Aletheia-Lens ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(inputs.release_tag || github.ref_name, 'beta') || contains(inputs.release_tag || github.ref_name, 'alpha') || contains(inputs.release_tag || github.ref_name, 'rc') }}
          files: dist/*.7z
